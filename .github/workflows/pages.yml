# Publishes the device configurator and the verified Pico firmware to GitHub Pages on every
# push to main. The Studio simulator is not part of the site (it ships in the desktop app). The firmware comes from the full release-mode verification
# (firmware.yml), so the site never offers a build that failed a suite.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one but never cancels a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  build:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The configurator's own tests ran in the firmware job (test_configurator_js)
      - name: Build the configurator site
        run: node scripts/build-site.cjs
      - uses: actions/download-artifact@v4
        with:
          name: pico-firmware
          path: firmware-bin
      # The configurator's Download firmware button links to ./driftpad.uf2
      - name: Add the verified firmware to the site
        run: |
          cp firmware-bin/firmware.uf2 dist-site/driftpad.uf2
          mkdir -p dist-site/firmware
          cp firmware-bin/build_manifest.json dist-site/firmware/build_manifest.json
          (cd dist-site && sha256sum driftpad.uf2 > firmware/SHA256SUMS.txt)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
