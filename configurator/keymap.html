<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftPad Keymap Editor</title>
    <style>
        :root {
            --bg-base: #0f1117;
            --bg-card: #181c27;
            --bg-elevated: #222738;
            --bg-well: #11141d;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.35);
            --accent-purple: #7928ca;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d3748;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --cap-edge: #3a4256;
            --cap-face: #2a3042;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-badge {
            background: linear-gradient(135deg, var(--accent), var(--accent-purple));
            color: #000; font-weight: 900; font-size: 13px;
            padding: 4px 10px; border-radius: 6px; letter-spacing: 1px;
        }
        .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
        .brand a { color: var(--text-muted); font-size: 13px; text-decoration: none; }
        .brand a:hover { color: var(--accent); }

        .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

        .btn {
            background: var(--bg-elevated);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            font: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; border: none; }
        .btn-danger { color: var(--red); border-color: rgba(239,68,68,0.4); }
        .btn-sm { padding: 6px 12px; font-size: 13px; }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); }
        .status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
        #statusText { font-size: 14px; font-weight: 600; color: var(--text-muted); }

        .layout {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            min-width: 0;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border); padding-bottom: 12px;
        }
        .card-title { font-size: 16px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .muted { font-size: 12px; color: var(--text-muted); }

        .layer-tabs { display: flex; background: var(--bg-elevated); border-radius: 8px; padding: 4px; gap: 4px; }
        .layer-tab {
            flex: 1; padding: 8px 10px; text-align: center; font: inherit; font-size: 13px; font-weight: 600;
            border: none; border-radius: 6px; cursor: pointer; color: var(--text-muted); background: none;
        }
        .layer-tab.active { background: var(--accent); color: #000; box-shadow: 0 2px 8px var(--accent-glow); }

        /* ---- Physical pad: mirrors the DriftPad top plate ---- */
        .pad {
            --u: 80px;
            display: grid;
            grid-template-columns: repeat(4, var(--u));
            grid-auto-rows: var(--u);
            gap: 10px;
            background: var(--bg-well);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            align-self: center;
        }

        .oled {
            grid-column: span 3;
            background: #000;
            border: 3px solid var(--cap-edge);
            border-radius: 8px;
            padding: 8px 10px;
            font-family: Consolas, "Courier New", monospace;
            color: #9fe8ff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            text-shadow: 0 0 4px rgba(0, 242, 254, 0.5);
        }
        .oled-top { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.8; }
        .oled-main { font-size: 22px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
        .oled-sub { font-size: 11px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .knob {
            border: 3px solid var(--cap-edge);
            border-radius: 8px;
            background: var(--bg-elevated);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            cursor: help;
        }
        .knob-dial {
            width: 42px; height: 42px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4a5268, #1b1f2c 70%);
            border: 2px solid #4a5268;
            position: relative;
        }
        .knob-dial::after {
            content: ""; position: absolute; top: 4px; left: 50%; width: 3px; height: 12px;
            margin-left: -1.5px; border-radius: 2px; background: var(--accent);
        }
        .knob span { font-size: 10px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; }

        .cap {
            position: relative;
            border: 3px solid var(--cap-edge);
            border-radius: 8px;
            background: var(--cap-edge);
            padding: 0 0 6px 0;
            cursor: pointer;
            font: inherit;
            color: var(--text-main);
            transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
        }
        .cap-face {
            height: 100%;
            border-radius: 5px;
            background: linear-gradient(180deg, #343b50, var(--cap-face));
            display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
            padding: 6px 8px;
            text-align: left;
        }
        .cap:hover { border-color: var(--accent); transform: translateY(-2px); }
        .cap.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow), 0 0 18px var(--accent-glow); }
        .cap.pressed .cap-face { background: linear-gradient(135deg, #10b981, #059669); }
        .cap-label { font-size: 16px; font-weight: 700; }
        .cap-name { font-size: 10px; color: var(--text-muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
        .cap-flag {
            position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%;
        }
        .cap-flag.custom { background: var(--accent-purple); }
        .cap-flag.unsynced { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

        .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--text-muted); }
        .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

        .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

        /* ---- Editor ---- */
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        input[type="text"], input[type="number"], input[type="search"] {
            background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-main);
            padding: 8px 12px; border-radius: 6px; font: inherit; font-size: 14px; width: 100%;
        }
        input:focus { outline: none; border-color: var(--accent); }

        .current {
            display: grid; grid-template-columns: 1fr 1fr 110px; gap: 12px; align-items: end;
        }

        .capture-btn.listening { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 12px rgba(245,158,11,0.4); }

        .cat-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
        .cat-tab {
            background: none; border: 1px solid var(--border); color: var(--text-muted);
            padding: 5px 10px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .cat-tab.active { border-color: var(--accent); color: var(--accent); }

        .picker {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 6px;
            max-height: 290px;
            overflow-y: auto;
            padding: 2px;
        }
        .pick {
            background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-main);
            border-radius: 6px; padding: 8px 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
            min-height: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .pick:hover { border-color: var(--accent); }
        .pick.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 16px; font-size: 13px; opacity: 0; pointer-events: none; transition: 0.25s; z-index: 50;
            max-width: calc(100vw - 32px);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: var(--red); color: #fca5a5; }

        .log {
            background: #090b10; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
            font-family: Consolas, monospace; font-size: 11px; color: var(--green);
            height: 90px; overflow-y: auto;
        }

        @media (max-width: 900px) {
            body { padding: 16px; }
            .layout { grid-template-columns: 1fr; }
        }
        @media (max-width: 420px) {
            .pad { --u: 66px; gap: 8px; padding: 10px; }
            .cap-label { font-size: 14px; }
            .oled { padding: 5px 8px; }
            .oled-top, .oled-sub { font-size: 10px; }
            .oled-main { font-size: 18px; }
            .current { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <span class="brand-badge">HE</span>
        <h1>DriftPad Keymap Editor</h1>
        <a href="index.html">← Configurator</a>
    </div>
    <div class="header-actions">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Offline draft</span>
        <button id="connectBtn" class="btn btn-primary" onclick="toggleConnect()">Connect DriftPad</button>
    </div>
</header>

<div class="layout">

    <!-- Left: the pad itself -->
    <section class="card">
        <div class="card-header">
            <span class="card-title">Layout</span>
            <span id="syncSummary" class="muted">Not connected</span>
        </div>

        <div class="layer-tabs" id="layerTabs"></div>

        <div class="pad" id="pad">
            <div class="oled" id="oled">
                <div class="oled-top"><span id="oledLayer">L0 NUMPAD</span><span>DISPLAY</span></div>
                <div class="oled-main" id="oledMain">ESC</div>
                <div class="oled-sub" id="oledSub">KEY 0 · Esc</div>
            </div>
            <div class="knob" title="The knob drives the on-device menu (actuation, RT, layer) and is not remappable.">
                <div class="knob-dial"></div>
                <span>KNOB</span>
            </div>
            <!-- 16 key caps inserted here -->
        </div>

        <div class="legend">
            <span><i style="background: var(--accent-purple)"></i>Changed from default</span>
            <span><i style="background: var(--amber)"></i>Not yet written to device</span>
        </div>

        <div class="row">
            <button class="btn btn-sm" onclick="resetLayer()">Reset layer to default</button>
            <button class="btn btn-sm btn-danger" onclick="resetAll()">Reset all layers</button>
        </div>
        <div class="row">
            <button class="btn btn-sm" onclick="exportJson()">Export JSON</button>
            <button class="btn btn-sm" onclick="document.getElementById('importFile').click()">Import JSON</button>
            <input type="file" id="importFile" accept="application/json,.json" hidden onchange="importJson(this)">
        </div>
    </section>

    <!-- Right: key editor -->
    <section class="card">
        <div class="card-header">
            <span class="card-title" id="editorTitle">Key 0</span>
            <button class="btn btn-sm" onclick="resetKey()">Reset key</button>
        </div>

        <div class="current">
            <div class="field">
                <label for="labelInput">OLED label (max 4)</label>
                <input type="text" id="labelInput" maxlength="4" autocomplete="off" oninput="onLabelInput(this)">
            </div>
            <div class="field">
                <label>Sends</label>
                <div id="sendsName" style="font-weight: 700; padding: 8px 0;">Esc</div>
            </div>
            <div class="field">
                <label for="codeInput">Keycode</label>
                <input type="number" id="codeInput" min="0" max="255" onchange="onCodeInput(this)">
            </div>
        </div>

        <div class="row">
            <button id="captureBtn" class="btn capture-btn" onclick="toggleCapture()">⌨ Press a key to assign</button>
            <span class="muted" id="captureHint">Or pick one below.</span>
        </div>

        <div class="field">
            <input type="search" id="search" placeholder="Search keys (e.g. f13, ctrl, page)" oninput="renderPicker()">
        </div>
        <div class="cat-tabs" id="catTabs"></div>
        <div class="picker" id="picker"></div>

        <div class="card-header" style="border-bottom: none; border-top: 1px solid var(--border); padding: 12px 0 0;">
            <span class="card-title" style="font-size: 13px;">Device</span>
            <div class="row">
                <button id="readBtn" class="btn btn-sm" onclick="loadFromDevice()" disabled>Load from device</button>
                <button id="writeBtn" class="btn btn-sm btn-primary" onclick="writeToDevice()" disabled>Write to device</button>
            </div>
        </div>
        <div class="log" id="log"></div>
    </section>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Key catalog: Arduino Keyboard codes (arduino-pico HID_Keyboard.h).
// `ev` is the KeyboardEvent.code used for "press a key to assign".
// ---------------------------------------------------------------------------
const KEYS = [];
function add(cat, code, name, label, ev) { KEYS.push({ cat, code, name, label, ev }); }

add("Basic", 0x00, "None", "NONE", null);
add("Basic", 0xB1, "Esc", "ESC", "Escape");
add("Basic", 0xB0, "Enter", "ENT", "Enter");
add("Basic", 0xB3, "Tab", "TAB", "Tab");
add("Basic", 0xB2, "Backspace", "BSPC", "Backspace");
add("Basic", 32,   "Space", "SPCE", "Space");
add("Basic", 0xC1, "Caps Lock", "CAPS", "CapsLock");
add("Basic", 0xED, "Menu", "MENU", "ContextMenu");
add("Basic", 0xCE, "Print Screen", "PRSC", "PrintScreen");
add("Basic", 0xCF, "Scroll Lock", "SCRL", "ScrollLock");
add("Basic", 0xD0, "Pause", "PAUS", "Pause");

for (let i = 0; i < 26; i++) {
    const ch = String.fromCharCode(65 + i);
    add("Letters", 97 + i, ch, ch, "Key" + ch);
}
for (let i = 0; i < 10; i++) add("Numbers", 48 + i, String(i), String(i), "Digit" + i);
[
    [45, "-", "Minus"], [61, "=", "Equal"], [91, "[", "BracketLeft"], [93, "]", "BracketRight"],
    [92, "\\", "Backslash"], [59, ";", "Semicolon"], [39, "'", "Quote"], [96, "`", "Backquote"],
    [44, ",", "Comma"], [46, ".", "Period"], [47, "/", "Slash"],
].forEach(([c, s, ev]) => add("Numbers", c, s, s, ev));

for (let i = 1; i <= 24; i++) {
    const code = i <= 12 ? 0xC1 + i : 0xF0 + (i - 13);
    add("Function", code, "F" + i, "F" + i, "F" + i);
}

add("Navigation", 0xDA, "Up", "UP", "ArrowUp");
add("Navigation", 0xD9, "Down", "DOWN", "ArrowDown");
add("Navigation", 0xD8, "Left", "LEFT", "ArrowLeft");
add("Navigation", 0xD7, "Right", "RGHT", "ArrowRight");
add("Navigation", 0xD2, "Home", "HOME", "Home");
add("Navigation", 0xD5, "End", "END", "End");
add("Navigation", 0xD3, "Page Up", "PGUP", "PageUp");
add("Navigation", 0xD6, "Page Down", "PGDN", "PageDown");
add("Navigation", 0xD1, "Insert", "INS", "Insert");
add("Navigation", 0xD4, "Delete", "DEL", "Delete");

add("Modifiers", 0x80, "Left Ctrl", "CTRL", "ControlLeft");
add("Modifiers", 0x81, "Left Shift", "SHFT", "ShiftLeft");
add("Modifiers", 0x82, "Left Alt", "ALT", "AltLeft");
add("Modifiers", 0x83, "Left Win/Cmd", "GUI", "MetaLeft");
add("Modifiers", 0x84, "Right Ctrl", "RCTL", "ControlRight");
add("Modifiers", 0x85, "Right Shift", "RSFT", "ShiftRight");
add("Modifiers", 0x86, "Right Alt", "RALT", "AltRight");
add("Modifiers", 0x87, "Right Win/Cmd", "RGUI", "MetaRight");

add("Numpad", 0xDB, "Num Lock", "NUML", "NumLock");
add("Numpad", 0xDC, "Numpad /", "N/", "NumpadDivide");
add("Numpad", 0xDD, "Numpad *", "N*", "NumpadMultiply");
add("Numpad", 0xDE, "Numpad -", "N-", "NumpadSubtract");
add("Numpad", 0xDF, "Numpad +", "N+", "NumpadAdd");
add("Numpad", 0xE0, "Numpad Enter", "NENT", "NumpadEnter");
add("Numpad", 0xEB, "Numpad .", "N.", "NumpadDecimal");
for (let i = 1; i <= 9; i++) add("Numpad", 0xE0 + i, "Numpad " + i, "N" + i, "Numpad" + i);
add("Numpad", 0xEA, "Numpad 0", "N0", "Numpad0");

const BY_CODE = new Map(KEYS.map(k => [k.code, k]));
const BY_EV = new Map(KEYS.filter(k => k.ev).map(k => [k.ev, k]));
const CATEGORIES = ["All", ...new Set(KEYS.map(k => k.cat))];

function keyName(code) {
    const k = BY_CODE.get(code);
    return k ? k.name : `Code ${code}`;
}

// ---------------------------------------------------------------------------
// Default layout. Layer 0 is the physical legend printed on the pad:
//   Esc     7       8   9
//   Macro1  4       5   6
//   Macro2  1       2   3
//   Macro3  Macro4  0   Enter
// Macro1-4 send F13-F16 so they can be bound in any app without colliding.
// Must stay in sync with setDefaultKeymaps() in firmware/src/config.cpp.
// ---------------------------------------------------------------------------
const LAYER_NAMES = ["Numpad", "Navigation", "WASD Gaming"];
const DEFAULTS = [
    [[0xB1,"ESC"],[55,"7"],[56,"8"],[57,"9"],
     [0xF0,"M1"],[52,"4"],[53,"5"],[54,"6"],
     [0xF1,"M2"],[49,"1"],[50,"2"],[51,"3"],
     [0xF2,"M3"],[0xF3,"M4"],[48,"0"],[0xB0,"ENT"]],
    [[0xB1,"ESC"],[0xD2,"HOME"],[0xDA,"UP"],[0xD3,"PGUP"],
     [0xB3,"TAB"],[0xD8,"LEFT"],[0xD9,"DOWN"],[0xD7,"RGHT"],
     [0xD1,"INS"],[0xD5,"END"],[0xD9,"DOWN"],[0xD6,"PGDN"],
     [0xB2,"BSPC"],[0xD4,"DEL"],[32,"SPCE"],[0xB0,"ENT"]],
    [[0xB1,"ESC"],[49,"1"],[50,"2"],[51,"3"],
     [0xB3,"TAB"],[113,"Q"],[119,"W"],[101,"E"],
     [0x81,"SHFT"],[97,"A"],[115,"S"],[100,"D"],
     [0x80,"CTRL"],[114,"R"],[32,"SPCE"],[102,"F"]],
].map(layer => layer.map(([code, label]) => ({ code, label })));

const STORAGE_KEY = "driftpad.keymap.draft.v1";

function cloneLayers(layers) { return layers.map(l => l.map(k => ({ code: k.code, label: k.label }))); }
function sameKey(a, b) { return a && b && a.code === b.code && a.label === b.label; }

let draft = loadDraft();
let deviceLayers = null;   // last known device state, null until read
let layer = 0;
let keyIdx = 0;
let category = "All";
let capturing = false;

function loadDraft() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = validateLayers(JSON.parse(raw));
            if (parsed) return parsed;
        }
    } catch (e) {}
    return cloneLayers(DEFAULTS);
}

function saveDraft() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(draft)); } catch (e) {}
}

function sanitizeLabel(s) {
    // Firmware parses the label with %s and stores 4 chars: no spaces, printable ASCII.
    return String(s || "").toUpperCase().replace(/[^\x21-\x7E]/g, "").slice(0, 4);
}

function validateLayers(layers) {
    if (!Array.isArray(layers) || layers.length !== 3) return null;
    const out = [];
    for (const l of layers) {
        if (!Array.isArray(l) || l.length !== 16) return null;
        const row = [];
        for (const k of l) {
            const code = Number(k && k.code);
            if (!Number.isInteger(code) || code < 0 || code > 255) return null;
            row.push({ code, label: sanitizeLabel(k.label) || (BY_CODE.get(code)?.label ?? "KEY") });
        }
        out.push(row);
    }
    return out;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function render() {
    renderTabs();
    renderPad();
    renderEditor();
    renderPicker();
    renderSync();
}

function renderTabs() {
    const tabs = document.getElementById("layerTabs");
    tabs.innerHTML = "";
    LAYER_NAMES.forEach((name, i) => {
        const b = document.createElement("button");
        b.className = "layer-tab" + (i === layer ? " active" : "");
        b.textContent = `L${i}: ${name}`;
        b.onclick = () => { layer = i; render(); };
        tabs.appendChild(b);
    });
}

function renderPad() {
    const pad = document.getElementById("pad");
    pad.querySelectorAll(".cap").forEach(el => el.remove());
    draft[layer].forEach((k, i) => {
        const cap = document.createElement("button");
        cap.className = "cap" + (i === keyIdx ? " selected" : "");
        cap.id = `cap_${i}`;
        cap.title = `Key ${i}: ${keyName(k.code)} (code ${k.code})`;
        cap.onclick = () => { keyIdx = i; stopCapture(); render(); };

        const face = document.createElement("div");
        face.className = "cap-face";
        const label = document.createElement("div");
        label.className = "cap-label";
        label.textContent = k.label;
        const name = document.createElement("div");
        name.className = "cap-name";
        name.textContent = keyName(k.code);
        face.append(label, name);
        cap.appendChild(face);

        if (deviceLayers && !sameKey(k, deviceLayers[layer][i])) {
            cap.appendChild(Object.assign(document.createElement("span"), { className: "cap-flag unsynced" }));
        } else if (!sameKey(k, DEFAULTS[layer][i])) {
            cap.appendChild(Object.assign(document.createElement("span"), { className: "cap-flag custom" }));
        }
        pad.appendChild(cap);
    });

    const k = draft[layer][keyIdx];
    document.getElementById("oledLayer").textContent = `L${layer} ${LAYER_NAMES[layer].toUpperCase()}`;
    document.getElementById("oledMain").textContent = k.label;
    document.getElementById("oledSub").textContent = `KEY ${keyIdx} · ${keyName(k.code)}`;
}

function renderEditor() {
    const k = draft[layer][keyIdx];
    const row = Math.floor(keyIdx / 4) + 1, col = (keyIdx % 4) + 1;
    document.getElementById("editorTitle").textContent = `Key ${keyIdx} · row ${row}, col ${col} · L${layer}`;
    const labelInput = document.getElementById("labelInput");
    if (document.activeElement !== labelInput) labelInput.value = k.label;
    document.getElementById("codeInput").value = k.code;
    document.getElementById("sendsName").textContent = keyName(k.code);
}

function renderPicker() {
    const tabs = document.getElementById("catTabs");
    tabs.innerHTML = "";
    CATEGORIES.forEach(c => {
        const b = document.createElement("button");
        b.className = "cat-tab" + (c === category ? " active" : "");
        b.textContent = c;
        b.onclick = () => { category = c; renderPicker(); };
        tabs.appendChild(b);
    });

    const q = document.getElementById("search").value.trim().toLowerCase();
    const current = draft[layer][keyIdx].code;
    const picker = document.getElementById("picker");
    picker.innerHTML = "";
    KEYS.filter(k => (category === "All" || k.cat === category) &&
                     (!q || k.name.toLowerCase().includes(q) || k.label.toLowerCase().includes(q)))
        .forEach(k => {
            const b = document.createElement("button");
            b.className = "pick" + (k.code === current ? " active" : "");
            b.textContent = k.name;
            b.title = `${k.name} (code ${k.code})`;
            b.onclick = () => assign(k.code);
            picker.appendChild(b);
        });
}

function renderSync() {
    const summary = document.getElementById("syncSummary");
    const writeBtn = document.getElementById("writeBtn");
    document.getElementById("readBtn").disabled = !port;
    if (!port) {
        summary.textContent = "Not connected · edits are saved in this browser";
        writeBtn.disabled = true;
        writeBtn.textContent = "Write to device";
        return;
    }
    if (!deviceLayers) {
        summary.textContent = "Reading device…";
        writeBtn.disabled = true;
        return;
    }
    const n = pendingChanges().length;
    summary.textContent = n ? `${n} key${n > 1 ? "s" : ""} not yet written` : "In sync with device";
    writeBtn.disabled = n === 0 || writing;
    writeBtn.textContent = n ? `Write ${n} change${n > 1 ? "s" : ""}` : "Write to device";
}

// ---------------------------------------------------------------------------
// Editing
// ---------------------------------------------------------------------------
function assign(code) {
    const k = draft[layer][keyIdx];
    const oldDefaultLabel = BY_CODE.get(k.code)?.label;
    k.code = code;
    // Replace the label only if the user hadn't customized it.
    if (!k.label || k.label === oldDefaultLabel || k.label === DEFAULTS[layer][keyIdx].label) {
        k.label = BY_CODE.get(code)?.label ?? "KEY";
    }
    saveDraft();
    render();
}

function onLabelInput(el) {
    const clean = sanitizeLabel(el.value);
    if (clean !== el.value) el.value = clean;
    draft[layer][keyIdx].label = clean || (BY_CODE.get(draft[layer][keyIdx].code)?.label ?? "KEY");
    saveDraft();
    renderPad();
    renderSync();
}

function onCodeInput(el) {
    const code = parseInt(el.value, 10);
    if (Number.isInteger(code) && code >= 0 && code <= 255) assign(code);
    else el.value = draft[layer][keyIdx].code;
}

function resetKey() {
    draft[layer][keyIdx] = { ...DEFAULTS[layer][keyIdx] };
    saveDraft(); render();
}

function resetLayer() {
    draft[layer] = cloneLayers(DEFAULTS)[layer];
    saveDraft(); render();
    toast(`Layer ${layer} reset to default. Write to device to apply.`);
}

function resetAll() {
    if (!confirm("Reset all three layers to the default layout?")) return;
    draft = cloneLayers(DEFAULTS);
    saveDraft(); render();
}

// "Press a key to assign"
function toggleCapture() { capturing ? stopCapture() : startCapture(); }
function startCapture() {
    capturing = true;
    document.getElementById("captureBtn").classList.add("listening");
    document.getElementById("captureBtn").textContent = "Listening… press a key";
    document.getElementById("captureHint").textContent = "Esc is assignable too. Click the button again to cancel.";
}
function stopCapture() {
    capturing = false;
    document.getElementById("captureBtn").classList.remove("listening");
    document.getElementById("captureBtn").textContent = "⌨ Press a key to assign";
    document.getElementById("captureHint").textContent = "Or pick one below.";
}
window.addEventListener("keydown", e => {
    if (!capturing) return;
    e.preventDefault();
    e.stopPropagation();
    const k = BY_EV.get(e.code);
    stopCapture();
    if (k) { assign(k.code); toast(`Key ${keyIdx} → ${k.name}`); }
    else toast(`"${e.code || e.key}" isn't a key the pad can send.`, true);
}, true);

// Import / export
function exportJson() {
    const data = { device: "DriftPad", version: 1, layers: draft };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "driftpad-keymap.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importJson(input) {
    const file = input.files[0];
    input.value = "";
    if (!file) return;
    file.text().then(text => {
        const data = JSON.parse(text);
        const layers = validateLayers(Array.isArray(data) ? data : data.layers);
        if (!layers) throw new Error("expected 3 layers of 16 keys");
        draft = layers;
        saveDraft(); render();
        toast("Keymap imported. Write to device to apply.");
    }).catch(err => toast("Import failed: " + err.message, true));
}

let toastTimer = null;
function toast(msg, isError) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = "toast", 2600);
}

// ---------------------------------------------------------------------------
// WebSerial (same line protocol as index.html, see docs/serial-protocol.md)
// ---------------------------------------------------------------------------
let port = null, reader = null, writer = null;
let replyWaiter = null;
let writing = false;

function log(msg) {
    const box = document.getElementById("log");
    const line = document.createElement("div");
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
}

async function toggleConnect() {
    if (port) { await disconnect(); return; }
    if (!navigator.serial) {
        toast("WebSerial needs Chrome, Edge or Opera. You can still edit and export offline.", true);
        return;
    }
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        const dec = new TextDecoderStream();
        port.readable.pipeTo(dec.writable).catch(() => {});
        reader = dec.readable.getReader();
        const enc = new TextEncoderStream();
        enc.readable.pipeTo(port.writable).catch(() => {});
        writer = enc.writable.getWriter();
        setConnected(true);
        log("Connected.");
        readLoop();
        send("GET_CONFIG");
    } catch (err) {
        log("Connection error: " + err.message);
        port = null;
        setConnected(false);
    }
}

async function disconnect() {
    try { await reader?.cancel(); } catch (e) {}
    try { writer?.releaseLock(); } catch (e) {}
    try { await port?.close(); } catch (e) {}
    port = reader = writer = null;
    deviceLayers = null;
    setConnected(false);
    log("Disconnected.");
    render();
}

function setConnected(on) {
    document.getElementById("statusDot").classList.toggle("connected", on);
    document.getElementById("statusText").textContent = on ? "Connected" : "Offline draft";
    document.getElementById("connectBtn").textContent = on ? "Disconnect" : "Connect DriftPad";
    renderSync();
}

async function send(cmd) {
    if (!writer) return;
    await writer.write(cmd + "\n");
    log("TX → " + cmd);
}

async function readLoop() {
    let buf = "";
    try {
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += value;
            const lines = buf.split("\n");
            buf = lines.pop();
            lines.forEach(l => handleLine(l.trim()));
        }
    } catch (err) {
        log("Reader stopped: " + err.message);
    }
    if (port) disconnect();
}

function handleLine(line) {
    if (!line) return;
    let data;
    try { data = JSON.parse(line); } catch (e) { return; }  // plain-text firmware logs

    if (data.type === "config") {
        const layers = validateLayers(data.layers);
        if (layers) {
            deviceLayers = layers;
            log("Device keymap loaded.");
            render();
        }
    } else if (data.type === "status" && Array.isArray(data.keys)) {
        data.keys.forEach(k => document.getElementById(`cap_${k.idx}`)?.classList.toggle("pressed", !!k.pressed));
    } else if (data.status && replyWaiter) {
        const w = replyWaiter; replyWaiter = null; w(data);
    }
    if (data.status === "error") log("Device error: " + data.msg);
}

function waitReply(ms) {
    return new Promise(resolve => {
        const timer = setTimeout(() => { replyWaiter = null; resolve(null); }, ms);
        replyWaiter = d => { clearTimeout(timer); resolve(d); };
    });
}

function loadFromDevice() {
    if (!deviceLayers) { send("GET_CONFIG"); return; }
    const n = pendingChanges().length;
    if (n && !confirm(`Replace your draft with the keymap on the device? ${n} unwritten change${n > 1 ? "s" : ""} will be lost.`)) return;
    draft = cloneLayers(deviceLayers);
    saveDraft(); render();
    toast("Loaded keymap from device.");
}

function pendingChanges() {
    if (!deviceLayers) return [];
    const out = [];
    for (let l = 0; l < 3; l++)
        for (let i = 0; i < 16; i++)
            if (!sameKey(draft[l][i], deviceLayers[l][i])) out.push([l, i]);
    return out;
}

async function writeToDevice() {
    const changes = pendingChanges();
    if (!changes.length || writing) return;
    writing = true;
    renderSync();
    let ok = 0;
    for (const [l, i] of changes) {
        const k = draft[l][i];
        const reply = waitReply(1500);
        await send(`SET_KEY ${l} ${i} ${k.code} ${k.label}`);
        const res = await reply;
        if (res && res.status === "ok") {
            deviceLayers[l][i] = { ...k };
            ok++;
            render();
        } else {
            toast(`Key ${i} on layer ${l} failed: ${res ? res.msg : "no reply"}`, true);
            break;
        }
    }
    writing = false;
    renderSync();
    if (ok === changes.length) toast(`Wrote ${ok} key${ok > 1 ? "s" : ""}. Saved to flash.`);
}

render();
</script>
