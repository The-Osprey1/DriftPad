; PlatformIO Project Configuration File for DriftPad (RP2040)
;
; Toolchain inputs are locked in toolchain.lock.json and checked by tools/check_toolchain.py:
; platform maxgerhardt/platform-raspberrypi @ 5d4561a0, arduino-pico core 6.1.0-4 (fd65f6d4),
; toolchain-rp2040-earlephilhower 5.160100.260719 (GCC 16.1). Libraries are pinned exactly below.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; Two 4 KB flash sectors below the legacy EEPROM sector hold the A/B settings store
; (firmware/src/settings_store.cpp). LittleFS is not mounted on them.
board_build.filesystem_size = 8k

; Stamps firmware version, git revision and commit date into the build (see include/build_info.h)
extra_scripts = pre:scripts/build_info.py

build_flags =
    -DUSE_SH1106=0

lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit SH110X @ 2.1.15
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BusIO @ 1.17.4
    Wire
    SPI
    tusb-hid
    Keyboard.pio
